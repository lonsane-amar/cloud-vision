<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 50 420 300" width="100%" height="100%">
  <defs>
    <linearGradient id="favSunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC72C" />
      <stop offset="100%" stop-color="#FF9500" />
    </linearGradient>
    <linearGradient id="favCloudGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#29B6F6" />
      <stop offset="45%" stop-color="#0288D1" />
      <stop offset="100%" stop-color="#01579B" />
    </linearGradient>
    <radialGradient id="favIrisGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#29B6F6" />
      <stop offset="70%" stop-color="#0288D1" />
      <stop offset="100%" stop-color="#014A8F" />
    </radialGradient>
  </defs>

  <!-- Sun & Rays -->
  <g>
    <circle cx="345" cy="155" r="46" fill="url(#favSunGrad)" />
    <line x1="312" y1="108" x2="300" y2="92" stroke="#FFAC1C" stroke-width="8.5" stroke-linecap="round" />
    <line x1="345" y1="94" x2="345" y2="74" stroke="#FFAC1C" stroke-width="8.5" stroke-linecap="round" />
    <line x1="378" y1="108" x2="394" y2="92" stroke="#FFAC1C" stroke-width="8.5" stroke-linecap="round" />
    <line x1="400" y1="135" x2="422" y2="128" stroke="#FFAC1C" stroke-width="8.5" stroke-linecap="round" />
    <line x1="404" y1="168" x2="426" y2="175" stroke="#FFAC1C" stroke-width="8.5" stroke-linecap="round" />
  </g>

  <!-- Cloud Body -->
  <path
    d="M 160 300
       C 115 300, 85 265, 85 220
       C 85 180, 115 148, 155 148
       C 165 148, 175 150, 184 154
       C 200 110, 240 80, 290 80
       C 350 80, 395 125, 400 182
       C 418 188, 435 204, 435 228
       C 435 258, 410 285, 380 290
       C 365 298, 320 300, 270 300
       Z"
    fill="url(#favCloudGrad)"
  />

  <!-- Eye Sclera -->
  <path
    d="M 130 220
       C 180 148, 305 148, 360 220
       C 305 292, 180 292, 130 220
       Z"
    fill="#FFFFFF"
  />

  <!-- Iris, Pupil, Highlight -->
  <circle cx="245" cy="220" r="42" fill="url(#favIrisGrad)" />
  <circle cx="245" cy="220" r="23" fill="#013A70" />
  <circle cx="236" cy="208" r="6.5" fill="#FFFFFF" />
</svg>
